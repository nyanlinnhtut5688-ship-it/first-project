<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Design</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url(images/moonanime.jpg);
            background-size: cover;
        }
        .container{
            width: 400px;
            height: 600px;
            background: rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .welcome{
            text-align: center;
            font-weight: 700;
            font-size: x-large;
            font-family: serif;
            margin-top: 20px;
        }
        .intro{
            text-align: center;
            
            font-family: serif;
        }
        .input{
            display: flex;
            flex-direction: column;
        }
        .textinput{
            padding: 20px;
            margin-bottom: 20px;
            margin-top: 20px;
            width: 300px;
        
        }
    </style>
</head>
<body>
    <div class="container">
<div class="welcome">
    <h1>Welcome Back</h1>
</div>
<div class="intro">
    <p>We miss you a lot and please fill your details.</p>
</div>
<div class="input">
    <input type="text" class="textinput">
    <input type="email" class="emailinput">
    <input type="password" class="passwordinput">
</div>
    </div>
</body>
</html>
